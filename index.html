<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honolytics — Quiz des capitales</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="logo" id="logo-home">🧭 Honolytics</div>
</header>

<main id="app">

  <!-- ÉCRAN D'ACCUEIL -->
  <section id="screen-home" class="screen">
    <h1>Quiz des capitales</h1>
    <p class="subtitle">Choisis tes options, puis une zone géographique pour lancer le quiz.</p>

    <div class="options-panel">
      <div class="option-group">
        <span class="option-label">Sens du quiz</span>
        <div class="toggle-group" id="toggle-direction">
          <button type="button" class="toggle-btn active" data-value="capital-to-country">Capitale → Pays</button>
          <button type="button" class="toggle-btn" data-value="country-to-capital">Pays → Capitale</button>
        </div>
      </div>
      <div class="option-group">
        <span class="option-label">Coordonnées</span>
        <div class="toggle-group" id="toggle-coords">
          <button type="button" class="toggle-btn active" data-value="yes">Avec coordonnées</button>
          <button type="button" class="toggle-btn" data-value="no">Sans coordonnées</button>
        </div>
      </div>
      <div class="option-group">
        <span class="option-label">Nombre de villes</span>
        <div class="toggle-group" id="toggle-count">
          <button type="button" class="toggle-btn" data-value="3">3</button>
          <button type="button" class="toggle-btn active" data-value="5">5</button>
          <button type="button" class="toggle-btn" data-value="10">10</button>
          <button type="button" class="toggle-btn" data-value="20">20</button>
        </div>
      </div>
    </div>

    <div class="scope-grid" id="scope-grid">
      <!-- généré en JS -->
    </div>
  </section>

  <!-- ÉCRAN DE QUIZ -->
  <section id="screen-quiz" class="screen hidden">
    <div class="quiz-header">
      <span id="quiz-progress">Ville 1/10</span>
      <span id="quiz-score">Score : 0</span>
    </div>

    <div class="city-card">
      <div class="city-label" id="city-question-label">Quelle est cette ville ?</div>
      <div class="city-name" id="city-name">—</div>
    </div>

    <form id="quiz-form" autocomplete="off">
      <div class="field">
        <label for="input-country" id="label-guess">Pays</label>
        <input type="text" id="input-country" placeholder="ex : France" />
        <span class="field-feedback" id="feedback-country"></span>
      </div>

      <div class="field-row" id="coords-row">
        <div class="field">
          <label for="input-lon">Longitude</label>
          <input type="number" step="any" id="input-lon" placeholder="ex : 2.35" />
          <span class="field-feedback" id="feedback-lon"></span>
        </div>
        <div class="field">
          <label for="input-lat">Latitude</label>
          <input type="number" step="any" id="input-lat" placeholder="ex : 48.85" />
          <span class="field-feedback" id="feedback-lat"></span>
        </div>
      </div>

      <div class="quiz-actions">
        <button type="submit" id="btn-validate" class="btn btn-primary">Valider</button>
        <button type="button" id="btn-next" class="btn btn-primary hidden">Ville suivante</button>
      </div>
    </form>

    <div class="map-wrap hidden" id="city-map-wrap">
      <iframe id="city-map" class="city-map" loading="lazy" title="Carte OpenStreetMap de la ville"></iframe>
    </div>
  </section>

  <!-- ÉCRAN DE RÉSULTATS -->
  <section id="screen-result" class="screen hidden">
    <h1>Résultat</h1>
    <div class="final-score" id="final-score">0 / 30</div>
    <div class="result-table-wrap">
      <table class="result-table" id="result-table">
        <thead>
          <tr>
            <th id="th-shown">Ville</th>
            <th id="th-guess">Pays</th>
            <th id="th-lon">Longitude</th>
            <th id="th-lat">Latitude</th>
            <th>Points</th>
          </tr>
        </thead>
        <tbody id="result-tbody"></tbody>
      </table>
    </div>
    <div class="quiz-actions">
      <button type="button" id="btn-replay" class="btn btn-primary">Rejouer cette zone</button>
      <button type="button" id="btn-home" class="btn btn-secondary">Retour à l'accueil</button>
    </div>
  </section>

</main>

<footer class="app-footer">Honolytics — données issues de cities.csv</footer>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
